<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Signing you in…</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 28rem;
			margin: 3rem auto;
			padding: 0 1rem;
			color: #333;
		}
	</style>
</head>
<body>
	<p id="status">Completing sign-in…</p>
	<script>
		(function () {
			var params = new URLSearchParams(window.location.search);
			var err = params.get('error');
			var code = params.get('code');
			var returnedState = params.get('state');

			if (err) {
				var why = params.get('error_description') || '';
				var msg = 'OAuth error: ' + err + (why ? ' — ' + why : '');
				if (err === 'access_denied') msg = 'You chose not to authorize this app.';
				document.getElementById('status').textContent = msg;
				document.body.appendChild(document.createElement('p')).innerHTML = '<a href="/">Back home</a>';
				return;
			}
			if (!code || !returnedState) {
				document.getElementById('status').textContent = 'Missing code or state.';
				document.body.appendChild(document.createElement('p')).innerHTML = '<a href="/">Back home</a>';
				return;
			}

			fetch('/api/exchange', {
				method: 'POST',
				credentials: 'same-origin',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ code: code, state: returnedState })
			})
				.then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); })
				.then(function (res) {
					if (!res.ok) {
						document.getElementById('status').textContent = 'Token exchange failed (' + res.status + ').';
						var pre = document.createElement('pre');
						pre.textContent = JSON.stringify(res.body, null, 2);
						document.body.appendChild(pre);
						document.body.appendChild(document.createElement('p')).innerHTML = '<a href="/">Back home</a>';
						return;
					}
					document.getElementById('status').textContent = 'Signed in. Redirecting…';
					window.location.replace('/');
				})
				.catch(function (e) {
					document.getElementById('status').textContent = 'Request failed: ' + e;
				});
		})();
	</script>
</body>
</html>
