<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Parascene callback</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
		pre { background: #f4f4f4; padding: 1rem; overflow: auto; font-size: 0.8rem; }
	</style>
</head>
<body>
	<h1>Callback</h1>
	<p id="status">Working…</p>
	<pre id="out"></pre>
	<p><a href="/">Back</a></p>
	<script>
		(function () {
			var params = new URLSearchParams(window.location.search);
			var err = params.get('error');
			var code = params.get('code');
			var returnedState = params.get('state');
			var expectedState = sessionStorage.getItem('psn_state');
			var verifier = sessionStorage.getItem('psn_pkce');
			var redirect = sessionStorage.getItem('psn_redirect');

			function show(obj) {
				document.getElementById('out').textContent = JSON.stringify(obj, null, 2);
			}

			if (err) {
				var why = params.get('error_description') || '';
				var line = 'OAuth error: ' + err + (why ? ' — ' + why : '');
				if (err === 'access_denied') {
					line = 'You chose not to authorize this app (access_denied).';
				}
				document.getElementById('status').textContent = line;
				show(Object.fromEntries(params));
				return;
			}
			if (!code || !returnedState || returnedState !== expectedState) {
				document.getElementById('status').textContent = 'Invalid state or missing code.';
				show({ code: !!code, stateOk: returnedState === expectedState });
				return;
			}
			if (!verifier || !redirect) {
				document.getElementById('status').textContent = 'Missing PKCE session (open Sign in from the home page).';
				return;
			}

			fetch('/api/exchange', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					code: code,
					redirect_uri: redirect,
					code_verifier: verifier
				})
			})
				.then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); })
				.then(async function (res) {
					sessionStorage.removeItem('psn_pkce');
					sessionStorage.removeItem('psn_state');
					sessionStorage.removeItem('psn_redirect');
					if (!res.ok) {
						document.getElementById('status').textContent = 'Token exchange failed (' + res.status + ')';
						show(res.body);
						return;
					}
					document.getElementById('status').textContent = 'Tokens received. Calling GET /oauth/userinfo…';
					var at = res.body.access_token;
					if (!at) {
						show(res.body);
						return;
					}
					var base = (window.PSN_BASE || 'https://www.parascene.com').replace(/\/$/, '');
					var ui = await fetch(base + '/oauth/userinfo', {
						headers: { Authorization: 'Bearer ' + at }
					});
					var profile = await ui.json();
					document.getElementById('status').textContent = 'Done.';
					show({ token_response: res.body, userinfo: profile });
				})
				.catch(function (e) {
					document.getElementById('status').textContent = 'Request failed';
					show({ error: String(e) });
				});
		})();
	</script>
	<!-- Match index.html if you use a non-production Parascene host -->
	<script>window.PSN_BASE = 'https://www.parascene.com';</script>
</body>
</html>
