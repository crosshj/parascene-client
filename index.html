<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Sign in — Parascene</title>
	<style>
		:root {
			--bg: #0a0812;
			--bg-radial: #1a1025;
			--surface: #12101c;
			--surface-2: #1a1628;
			--border: rgba(255, 255, 255, 0.08);
			--border-light: rgba(255, 255, 255, 0.12);
			--text: #f4f2f8;
			--text-muted: #9b92b0;
			--brand-400: #a78bfa;
			--brand-500: #8b5cf6;
			--brand-600: #7c3aed;
			--brand-700: #6d28d9;
			--brand-800: #5b21b6;
			--btn-text: #ffffff;
			--btn-shadow: 0 4px 20px rgba(91, 33, 182, 0.45);
			--shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
			--radius: 12px;
			--radius-pill: 999px;
			--font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
			--font-mono: ui-monospace, Menlo, monospace;
			--space: 8px;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: var(--font);
			font-size: 15px;
			line-height: 1.5;
			color: var(--text);
			background: var(--bg);
			background-image:
				radial-gradient(ellipse 100% 70% at 50% -30%, rgba(124, 58, 237, 0.22), transparent 50%),
				radial-gradient(ellipse 80% 50% at 100% 80%, rgba(91, 33, 182, 0.12), transparent 45%);
		}

		/* Centered shell — typical sign-in layout */
		.shell {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: calc(var(--space) * 3);
		}

		.wrap {
			width: 100%;
			max-width: 400px;
		}

		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow-card);
			padding: calc(var(--space) * 4);
		}

		.card--loose {
			padding: calc(var(--space) * 5);
		}

		.brand-mark {
			display: block;
			width: 48px;
			height: 48px;
			margin: 0 auto calc(var(--space) * 3);
			border-radius: 14px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
		}

		.h1 {
			margin: 0 0 calc(var(--space) * 1);
			font-size: 1.375rem;
			font-weight: 650;
			letter-spacing: -0.03em;
			text-align: center;
			line-height: 1.2;
		}

		.lede {
			margin: 0 0 calc(var(--space) * 4);
			font-size: 0.9375rem;
			color: var(--text-muted);
			text-align: center;
			line-height: 1.5;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			width: 100%;
			padding: 14px 20px;
			font-size: 0.9375rem;
			font-weight: 600;
			font-family: inherit;
			line-height: 1.2;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			text-decoration: none;
			transition: filter 0.15s ease, transform 0.08s ease;
		}

		.btn:active {
			transform: scale(0.99);
		}

		.btn--brand {
			color: var(--btn-text);
			background: linear-gradient(165deg, var(--brand-700) 0%, var(--brand-800) 55%, #4c1d95 100%);
			box-shadow: var(--btn-shadow);
		}

		.btn--brand:hover {
			filter: brightness(1.08);
		}

		.btn__glyph {
			width: 24px;
			height: 24px;
			flex-shrink: 0;
			border-radius: 8px;
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
		}

		.btn--quiet {
			width: 100%;
			padding: 12px;
			margin-top: calc(var(--space) * 2);
			font-size: 0.875rem;
			font-weight: 500;
			color: var(--text-muted);
			background: transparent;
			border: 1px solid var(--border-light);
			border-radius: 10px;
			cursor: pointer;
			font-family: inherit;
			transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
		}

		.btn--quiet:hover {
			color: var(--text);
			border-color: rgba(255, 255, 255, 0.2);
			background: rgba(255, 255, 255, 0.04);
		}

		.kicker {
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--brand-400);
			text-align: center;
			margin: 0 0 calc(var(--space) * 2);
		}

		.row-top {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: calc(var(--space) * 2);
			margin-bottom: calc(var(--space) * 4);
		}

		.pill {
			font-size: 0.6875rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--brand-400);
			background: rgba(124, 58, 237, 0.18);
			padding: 6px 10px;
			border-radius: var(--radius-pill);
			border: 1px solid rgba(167, 139, 250, 0.25);
			white-space: nowrap;
		}

		.avatar {
			width: 64px;
			height: 64px;
			border-radius: 50%;
			object-fit: cover;
			background: var(--surface-2);
			border: 2px solid var(--border-light);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
		}

		.name {
			font-size: 1.125rem;
			font-weight: 650;
			margin: 0;
			letter-spacing: -0.02em;
		}

		.handle {
			margin: 4px 0 0;
			font-size: 0.875rem;
			color: var(--text-muted);
		}

		.section-label {
			display: block;
			font-size: 0.75rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--text-muted);
			margin-bottom: calc(var(--space) * 2);
		}

		.code-block {
			margin: 0;
			padding: calc(var(--space) * 2);
			font-family: var(--font-mono);
			font-size: 0.7rem;
			line-height: 1.55;
			color: #c4bdd9;
			background: #0d0b14;
			border: 1px solid var(--border);
			border-radius: 8px;
			overflow: auto;
			max-height: 200px;
		}

		.loading-block {
			text-align: center;
			padding: calc(var(--space) * 6) calc(var(--space) * 2);
		}

		.spinner {
			width: 36px;
			height: 36px;
			margin: 0 auto calc(var(--space) * 3);
			border: 3px solid var(--border);
			border-top-color: var(--brand-500);
			border-radius: 50%;
			animation: spin 0.75s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		.muted {
			font-size: 0.875rem;
			color: var(--text-muted);
		}

		.is-hidden {
			display: none !important;
		}

		.alert {
			padding: calc(var(--space) * 2) calc(var(--space) * 3);
			font-size: 0.875rem;
			line-height: 1.45;
			color: #fecaca;
			background: rgba(127, 29, 29, 0.25);
			border: 1px solid rgba(248, 113, 113, 0.35);
			border-radius: 10px;
			margin-bottom: calc(var(--space) * 3);
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="shell">
		<div class="wrap">
			<div id="loading" class="loading-block">
				<div class="spinner" aria-hidden="true"></div>
				<p class="muted">One moment…</p>
			</div>

			<div id="guest" class="is-hidden">
				<div id="oauth-flash" class="alert is-hidden" role="alert"></div>
				<div class="card card--loose">
					<img
						class="brand-mark"
						src="https://www.parascene.com/favicon.svg"
						width="48"
						height="48"
						alt=""
						decoding="async"
					/>
					<h1 class="h1">Sign in</h1>
					<p class="lede">Continue with your Parascene account.</p>
					<a class="btn btn--brand" href="/api/auth/start">
						<img
							class="btn__glyph"
							src="https://www.parascene.com/favicon.svg"
							width="24"
							height="24"
							alt=""
							decoding="async"
						/>
						Continue with Parascene
					</a>
				</div>
			</div>

			<div id="user" class="is-hidden">
				<p class="kicker">Parascene demo</p>
				<div class="card">
					<div class="row-top">
						<div style="display: flex; align-items: center; gap: 16px; min-width: 0;">
							<img id="avatar" class="avatar" alt="" width="64" height="64" hidden />
							<div style="min-width: 0;">
								<p id="display-name" class="name"></p>
								<p id="username" class="handle"></p>
							</div>
						</div>
						<span class="pill">Signed in</span>
					</div>
					<span class="section-label">Profile</span>
					<pre id="userinfo-raw" class="code-block" aria-label="Profile JSON"></pre>
					<button type="button" class="btn--quiet" id="logout">Sign out</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		var pendingOauthError = null;
		(function readOAuthQuery() {
			var sp = new URLSearchParams(window.location.search);
			var err = sp.get('oauth_error');
			if (err) {
				pendingOauthError = err;
				if (window.history && window.history.replaceState) {
					window.history.replaceState({}, '', window.location.pathname || '/');
				}
			}
		})();

		function oauthErrorMessage(code) {
			var map = {
				access_denied: 'Sign-in was cancelled.',
				missing_code: 'Something went wrong. Please try again.',
				missing_oauth_session: 'Session expired. Sign in again.',
				state_mismatch: 'Security check failed. Try signing in again.',
				server_misconfigured: 'This app is not configured correctly.',
				token_exchange: 'Could not complete sign-in. Try again, or check the app setup.'
			};
			return map[code] || ('Something went wrong. Try again.');
		}

		function showGuest() {
			document.getElementById('loading').classList.add('is-hidden');
			document.getElementById('guest').classList.remove('is-hidden');
			document.getElementById('user').classList.add('is-hidden');
			var flash = document.getElementById('oauth-flash');
			if (pendingOauthError) {
				flash.textContent = oauthErrorMessage(pendingOauthError);
				flash.classList.remove('is-hidden');
				pendingOauthError = null;
			} else {
				flash.classList.add('is-hidden');
				flash.textContent = '';
			}
		}
		function pictureUrl(picture, parasceneBase) {
			if (!picture || typeof picture !== 'string') return '';
			var p = picture.trim();
			if (/^https?:\/\//i.test(p)) return p;
			if (p.startsWith('//')) return 'https:' + p;
			var b = (parasceneBase || 'https://www.parascene.com').replace(/\/$/, '');
			if (p.startsWith('/')) return b + p;
			return p;
		}
		function showUser(data) {
			document.getElementById('loading').classList.add('is-hidden');
			document.getElementById('guest').classList.add('is-hidden');
			document.getElementById('user').classList.remove('is-hidden');
			var u = data.userinfo || {};
			var base = data.parascene_base_url;
			document.getElementById('display-name').textContent = u.name || u.preferred_username || 'User';
			document.getElementById('username').textContent = u.preferred_username
				? '@' + u.preferred_username
				: (u.sub ? 'User #' + u.sub : '');
			var img = document.getElementById('avatar');
			var src = pictureUrl(u.picture, base);
			if (src) {
				img.src = src;
				img.hidden = false;
			} else {
				img.hidden = true;
			}
			document.getElementById('userinfo-raw').textContent = JSON.stringify(u, null, 2);
		}
		fetch('/api/session', { credentials: 'same-origin' })
			.then(function (r) { return r.json(); })
			.then(function (data) {
				if (data.signed_in) showUser(data);
				else showGuest();
			})
			.catch(function () {
				var el = document.getElementById('loading');
				el.innerHTML = '<p class="muted">Could not reach this app’s API. Run with <span style="font-family:ui-monospace;font-size:0.85em">vercel dev</span> or deploy to Vercel.</p>';
			});
		document.getElementById('logout').addEventListener('click', function () {
			fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
				.then(function () { window.location.reload(); });
		});
	</script>
</body>
</html>
